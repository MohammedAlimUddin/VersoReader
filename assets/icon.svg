<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f232a"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaecef"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d4dc"/>
      <stop offset="100%" stop-color="#b0b6c2"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#d62828"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Document Body with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Base Page -->
    <path d="M 68 56 L 148 56 L 188 96 L 188 200 L 68 200 Z" fill="url(#pageGrad)"/>
    
    <!-- Folded Corner -->
    <path d="M 148 56 L 148 96 L 188 96 Z" fill="url(#foldGrad)"/>
    <path d="M 148 56 L 148 96 L 188 96 Z" fill="none" stroke="#9da3af" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Outer Page Border -->
    <path d="M 68 56 L 148 56 L 188 96 L 188 200 L 68 200 Z" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Document Content Lines -->
    <rect x="88" y="112" width="80" height="7" rx="3.5" fill="#4a5568"/>
    <rect x="88" y="128" width="80" height="6" rx="3" fill="#a0aec0"/>
    <rect x="88" y="142" width="60" height="6" rx="3" fill="#a0aec0"/>

    <!-- Red "PDF" Badge Accent -->
    <rect x="88" y="164" width="54" height="20" rx="4" fill="url(#accentGrad)"/>
    <text x="115" y="178.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">PDF</text>
  </g>
</svg>


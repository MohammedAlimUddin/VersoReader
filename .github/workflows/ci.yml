name: VersoReader CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download Pdfium binaries
        run: bash scripts/setup_pdfium.sh

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Package standalone distribution bundle
        run: bash scripts/package.sh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verso-reader-linux-x86_64
          path: |
            dist/verso-reader-linux-x86_64.tar.gz
            dist/verso-reader-linux-x86_64.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/verso-reader-linux-x86_64.tar.gz
            dist/verso-reader-linux-x86_64.tar.gz.sha256
            dist/verso-reader-linux-x86_64.zip
            dist/verso-reader-linux-x86_64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

